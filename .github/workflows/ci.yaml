# CI (S0): `make check` on every push and pull request; on a push to main, also build the arm64 app
# image and push it to GHCR. GitHub-hosted runners only, with GITHUB_TOKEN: a fork's PR runs the
# checks and nothing else, and never touches your hosts. cd.yaml deploys after this succeeds on main.
# Tag scheme: sha-<short sha>, one immutable tag per commit (decisions/).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - run: make check

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: The app answers inside the image
        run: |
          docker run -d --name app-smoke -p 8000:8000 "${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/version | tee /dev/stderr |
            jq -e --arg sha "$GITHUB_SHA" '.git_sha == $sha'
          docker rm -f app-smoke
