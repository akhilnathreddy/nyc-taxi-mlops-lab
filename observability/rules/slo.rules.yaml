# SLO recording and alerting rules (S5, decision 013), evaluated by your Grafana Cloud stack's ruler.
# Prometheus rule format: https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/
# Metric names are contracts/metrics.yaml's. `make check` runs promtool on this file and on any
# *.test.yaml next to it.
#
# Each SLI is recorded as its *bad* ratio (errors, slow requests, fallback quotes) over 5m, 30m, 1h and
# 6h. Every SLO in observability/slo.yaml is 99%, so the error budget is 0.01 everywhere. Alerts are
# multi-window burn rates (Google SRE workbook): page when the budget burns 14.4x too fast over 1h and
# 5m (2% of a 30-day budget in an hour), or 6x over 6h and 30m (5% in 6 hours). The short window makes
# an alert stop soon after the problem does; the long one keeps a brief spike from paging.
groups:
  - name: slo-sli
    interval: 1m
    rules:
      # predict-availability: share of /predict answers that were 5xx.
      - record: slo:predict_errors:ratio_rate5m
        expr: (sum(rate(lab_http_requests_total{route="/predict",code=~"5.."}[5m])) or vector(0)) / sum(rate(lab_http_requests_total{route="/predict"}[5m]))
      - record: slo:predict_errors:ratio_rate30m
        expr: (sum(rate(lab_http_requests_total{route="/predict",code=~"5.."}[30m])) or vector(0)) / sum(rate(lab_http_requests_total{route="/predict"}[30m]))
      - record: slo:predict_errors:ratio_rate1h
        expr: (sum(rate(lab_http_requests_total{route="/predict",code=~"5.."}[1h])) or vector(0)) / sum(rate(lab_http_requests_total{route="/predict"}[1h]))
      - record: slo:predict_errors:ratio_rate6h
        expr: (sum(rate(lab_http_requests_total{route="/predict",code=~"5.."}[6h])) or vector(0)) / sum(rate(lab_http_requests_total{route="/predict"}[6h]))

      # predict-latency: share of /predict slower than 250 ms inside the app (the 0.25 bucket).
      - record: slo:predict_slow:ratio_rate5m
        expr: 1 - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[5m])) / sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[5m]))
      - record: slo:predict_slow:ratio_rate30m
        expr: 1 - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[30m])) / sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[30m]))
      - record: slo:predict_slow:ratio_rate1h
        expr: 1 - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[1h])) / sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[1h]))
      - record: slo:predict_slow:ratio_rate6h
        expr: 1 - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[6h])) / sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[6h]))

      # model-coverage: share of quotes from the static-median fallback instead of a model.
      - record: slo:predict_fallback:ratio_rate5m
        expr: (sum(rate(lab_predictions_total{source="fallback"}[5m])) or vector(0)) / sum(rate(lab_predictions_total[5m]))
      - record: slo:predict_fallback:ratio_rate30m
        expr: (sum(rate(lab_predictions_total{source="fallback"}[30m])) or vector(0)) / sum(rate(lab_predictions_total[30m]))
      - record: slo:predict_fallback:ratio_rate1h
        expr: (sum(rate(lab_predictions_total{source="fallback"}[1h])) or vector(0)) / sum(rate(lab_predictions_total[1h]))
      - record: slo:predict_fallback:ratio_rate6h
        expr: (sum(rate(lab_predictions_total{source="fallback"}[6h])) or vector(0)) / sum(rate(lab_predictions_total[6h]))

  - name: slo-alerts
    interval: 1m
    rules:
      - alert: PredictAvailabilityFastBurn
        expr: slo:predict_errors:ratio_rate1h > (14.4 * 0.01) and slo:predict_errors:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: {severity: page, slo: predict-availability}
        annotations:
          summary: /predict is answering 5xx fast enough to spend 2% of the month's error budget in an hour.
      - alert: PredictAvailabilitySlowBurn
        expr: slo:predict_errors:ratio_rate6h > (6 * 0.01) and slo:predict_errors:ratio_rate30m > (6 * 0.01)
        for: 5m
        labels: {severity: page, slo: predict-availability}
        annotations:
          summary: /predict is answering 5xx fast enough to spend 5% of the month's error budget in 6 hours.

      - alert: PredictLatencyFastBurn
        expr: slo:predict_slow:ratio_rate1h > (14.4 * 0.01) and slo:predict_slow:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: {severity: page, slo: predict-latency}
        annotations:
          summary: Too many /predict answers are slower than 250 ms (fast burn, 1h and 5m).
      - alert: PredictLatencySlowBurn
        expr: slo:predict_slow:ratio_rate6h > (6 * 0.01) and slo:predict_slow:ratio_rate30m > (6 * 0.01)
        for: 5m
        labels: {severity: page, slo: predict-latency}
        annotations:
          summary: Too many /predict answers are slower than 250 ms (slow burn, 6h and 30m).

      - alert: ModelCoverageFastBurn
        expr: slo:predict_fallback:ratio_rate1h > (14.4 * 0.01) and slo:predict_fallback:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: {severity: page, slo: model-coverage}
        annotations:
          summary: Riders are getting the static-median fallback instead of the model (fast burn, 1h and 5m).
      - alert: ModelCoverageSlowBurn
        expr: slo:predict_fallback:ratio_rate6h > (6 * 0.01) and slo:predict_fallback:ratio_rate30m > (6 * 0.01)
        for: 5m
        labels: {severity: page, slo: model-coverage}
        annotations:
          summary: Riders are getting the static-median fallback instead of the model (slow burn, 6h and 30m).
